<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>HR 工作台 · 知识库工具 Demo</title>
<style>
/* 
 * HR Workbench UI Foundation 
 * Derived from creative-desk-fe/src/styles/tokens/
 */

:root {
  /* Foundations */
  --font-family-base: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  
  /* Palette & Semantic Colors (creative-desk-fe tokens) */
  --color-brand-primary: #0c63fa;
  --color-brand-hover: #337eff;
  --color-brand-active: #0050db;
  --color-brand-soft: #edf4ff;
  --color-brand-border: #a5c6fe;
  
  --color-text-primary: #1f2329;
  --color-text-secondary: #5c6066;
  --color-text-tertiary: #95999e;
  --color-text-quaternary: #c4c7cc;
  --color-text-link: #0c63fa;
  --color-text-success: #018550;
  --color-text-warning: #944b01;
  --color-text-danger: #b50707;
  
  --color-surface-page: #f5f7fa;
  --color-surface-primary: #ffffff;
  --color-surface-secondary: #f5f7fa;
  --color-surface-hover: rgba(61, 86, 128, 0.06);
  --color-surface-active: rgba(61, 86, 128, 0.08);
  
  --color-border-default: #ebedf0;
  --color-border-subtle: #f0f2f5;
  --color-border-strong: #c4c7cc;
  
  --color-success: #06bf75;
  --color-success-soft: #e8faf3;
  --color-warning: #fc860f;
  --color-warning-soft: #fff1e5;
  --color-danger: #fc3232;
  --color-danger-soft: #fff5f5;
  
  --shadow-card: 0 8px 24px #2307b417, 0 1px 2px rgba(24, 24, 27, 0.03);
  --shadow-float: 0 6px 14px 0 rgba(31, 35, 41, 0.12);
  
  --radius-s: 4px;
  --radius-m: 6px;
  --radius-l: 8px;
  --radius-xl: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-family-base);
  color: var(--color-text-primary);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── Workbench Shell ── */
.workbench-shell {
  position: relative;
  min-height: 100vh;
  background: 
    radial-gradient(ellipse 42% 28% at -4% 8%, rgba(107, 92, 255, 0.21), transparent 72%),
    radial-gradient(ellipse 38% 27% at 104% 9%, rgba(46, 172, 255, 0.21), transparent 72%),
    radial-gradient(ellipse 32% 22% at 54% 13%, rgba(156, 105, 255, 0.13), transparent 74%),
    linear-gradient(180deg, #f2f6fc 0%, #f2f6fc 100%);
  display: flex;
  flex-direction: column;
}

.workbench-topbar {
  height: 62px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.workbench-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
  font-size: 16px;
}

.workbench-brand img { width: 28px; height: 28px; }

.workbench-main {
  flex: 1;
  padding: 24px 88px 48px;
  max-width: 1680px;
  margin: 0 auto;
  width: 100%;
}

.workbench-head {
  margin-bottom: 24px;
}

.workbench-head h1 {
  font-size: 30px;
  font-weight: 500;
  color: #0c0d0e;
}

.workbench-head p {
  color: var(--color-text-tertiary);
  font-size: 13px;
  margin-top: 4px;
}

/* ── Grid Canvas ── */
.workbench-canvas {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 16px;
}

/* ── HomeToolCard (The Glass Frame) ── */
.tool-card {
  background: rgba(255, 255, 255, 0.4);
  border: 1px solid #ffffff;
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  backdrop-filter: blur(10px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: box-shadow 0.16s ease, transform 0.16s ease;
}

.tool-card:hover {
  box-shadow: 0 8px 24px #2307b417, 0 1px 2px #18181b08;
}

.tool-card__header {
  padding: 16px 16px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 30px;
}

.tool-card__title {
  font-size: 18px;
  font-family: 'Source Han Serif CN', serif;
  font-weight: 700;
  color: var(--color-text-primary);
}

.tool-card__body {
  flex: 1;
  padding: 0 16px 16px;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

/* ── Shared UI Components ── */
.toft-button {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 32px;
  padding: 0 15px;
  border-radius: var(--radius-m);
  font-size: 14px;
  font-weight: 400;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s;
  background: #fff;
  color: var(--color-text-primary);
}

.toft-button--primary {
  background: var(--color-brand-primary);
  color: #fff;
  border-color: var(--color-brand-primary);
}

.toft-button--primary:hover {
  background: var(--color-brand-hover);
}

.toft-button--ghost {
  background: transparent;
  border-color: var(--color-border-default);
}

.toft-button--ghost:hover {
  background: var(--color-surface-hover);
  border-color: var(--color-border-strong);
}

.toft-tabs {
  display: flex;
  gap: 24px;
  border-bottom: 1px solid var(--color-border-default);
  margin-bottom: 16px;
}

.toft-tab {
  padding: 8px 0;
  font-size: 14px;
  color: var(--color-text-secondary);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  position: relative;
}

.toft-tab.active {
  color: var(--color-brand-primary);
  border-bottom-color: var(--color-brand-primary);
  font-weight: 500;
}

.toft-badge {
  display: inline-flex;
  padding: 0 6px;
  height: 18px;
  align-items: center;
  border-radius: 9px;
  font-size: 11px;
  font-weight: 600;
  background: var(--color-border-strong);
  color: #fff;
}

.toft-badge--danger { background: var(--color-danger); }

/* ── Tool specific UI ── */
.tool-search {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.7);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-m);
  padding: 4px 12px;
  width: 100%;
  margin-bottom: 12px;
}

.tool-search input {
  border: none;
  background: transparent;
  outline: none;
  flex: 1;
  font-size: 13px;
}

.tool-role-pills {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.tool-role-pill {
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 12px;
  background: var(--color-surface-secondary);
  color: var(--color-text-secondary);
  cursor: pointer;
}

.tool-role-pill.active {
  background: var(--color-brand-soft);
  color: var(--color-brand-primary);
}

</style>

<script>
/* ════════════════════════════════
   状态
════════════════════════════════ */
const KB_BASE = 'https://knowledge-cloud.staging.kuaishou.com/?app=hr#/ssc-service-delivery/kb';

const S = {
  role: 'hrbp',
  favs: new Set(JSON.parse(localStorage.getItem('hr-kc-favs') || '[]')),
  zoom: 1,
  pan: { x: 0, y: 0 },
  nodes: [], edges: [],
  hovered: null,
  dragging: false,
  dragMoved: false,
  showFavs: false,
  resolved: {},
};

const ROLE_LABEL = { hrbp:'HRBP', manager:'管理者', all:'全员', recruiter:'招聘' };
const KIND_META = {
  conflict: { label:'冲突 · 需裁决', color:'#fc3232' },
  proposal: { label:'变更 · 待确认', color:'#fc860f' },
  quality:  { label:'质量 · 待复核', color:'#7938fc' },
};

/* ════════════════════════════════
   消费卡片 — 图谱
════════════════════════════════ */
const canvas = document.getElementById('graphCanvas');
const ctx    = canvas.getContext('2d');
const FONT   = "-apple-system,'PingFang SC',sans-serif";

/* 配色：只用两色 + 灰，干净 */
const C = {
  center:     { fill:'#1f2329', text:'#fff' },
  domain:     { fill:'#1f2329', stroke:'#1f2329', text:'#fff' },
  sub:        { fill:'#fff', stroke:'#c4c7cc', text:'#5c6066' },
  page:       { fill:'#0c63fa', text:'#fff' },
  pageFav:    { fill:'#fc860f' },
  pageConfl:  { fill:'#fc3232' },
  edge:       'rgba(31,35,41,.10)',
};

/* ══ 视图切换 ══ */
let S_view = 'graph';

function switchView(v) {
  S_view = v;
  document.getElementById('vbGraph').classList.toggle('active', v==='graph');
  document.getElementById('vbList').classList.toggle('active', v==='list'||v==='drill');
  document.getElementById('graphAreaWrap').style.display = (v==='graph') ? '' : 'none';
  document.getElementById('graphHint').style.display     = (v==='graph') ? '' : 'none';
  // 角色 pills 只在图谱视图显示
  document.getElementById('rolePills').style.visibility = (v==='graph') ? '' : 'hidden';
  const lv = document.getElementById('listView');
  const dv = document.getElementById('drillView');
  lv.classList.toggle('lv-active', v==='list');
  dv.classList.toggle('dv-active', v==='drill');
  if (v==='list') renderListView();
  document.getElementById('favPanel').classList.remove('show');
}

/* ── 列表视图：合并所有角色的知识，按领域展示 ── */
function _getAllDomains() {
  // 合并所有角色 graph，以 domain.key 去重，page 以 id 去重
  const domainMap = new Map(); // key -> {label, subMap}
  Object.values(DATA.graph||{}).forEach(roleGraph => {
    (roleGraph.domains||[]).forEach(d => {
      if (!domainMap.has(d.key)) domainMap.set(d.key, {key:d.key, label:d.label, subMap:new Map()});
      const dm = domainMap.get(d.key);
      (d.children||[]).forEach(sub => {
        if (!dm.subMap.has(sub.key)) dm.subMap.set(sub.key, {key:sub.key, label:sub.label, pageMap:new Map()});
        const sm = dm.subMap.get(sub.key);
        (sub.pages||[]).forEach(p => { if (!sm.pageMap.has(p.id)) sm.pageMap.set(p.id, p); });
      });
    });
  });
  // 还原成数组
  return [...domainMap.values()].map(d => ({
    ...d,
    children: [...d.subMap.values()].map(sub => ({
      ...sub,
      pages: [...sub.pageMap.values()]
    }))
  }));
}

function renderListView() {
  const domains = _getAllDomains();
  const el = document.getElementById('listView');
  let html = '<div class="list-domains">';
  domains.forEach(d => {
    html += `<div class="list-domain-group">
      <div class="list-domain-hdr" onclick="toggleListDomain(this)">
        ${d.label}<span class="chevron">▶</span>
      </div>
      <div class="list-subdomain-wrap" style="display:none">`;
    (d.children||[]).forEach(sub => {
      html += `<div class="list-sub-hdr">${sub.label}</div>`;
      (sub.pages||[]).forEach(page => {
        const fav = S.favs.has(page.id);
        html += `<div class="list-page-row" onclick="openDrill('${page.id}')">
          <div class="list-page-dot"></div>
          <div class="list-page-name">${page.title}</div>
          <div class="list-page-date">${page.updatedAt||''}</div>
          ${fav ? '<div class="list-page-fav">★</div>' : ''}
        </div>`;
      });
    });
    html += '</div></div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

function toggleListDomain(hdr) {
  const opening = !hdr.classList.contains('open');
  hdr.classList.toggle('open', opening);
  hdr.nextElementSibling.style.display = opening ? '' : 'none';
}

/* ── 下钻：找 page（全量搜索，不依赖 S.role）── */
function _findPage(id) {
  for (const d of _getAllDomains())
    for (const sub of (d.children||[]))
      for (const p of (sub.pages||[]))
        if (p.id===id) return {page:p, domain:d, sub};
  return null;
}

/* ── 下钻：打开 ── */
function openDrill(pageId) {
  switchView('drill');
  _buildDrillNav(pageId);
  _renderDrillPage(pageId);
}

function _buildDrillNav(activeId) {
  const domains = _getAllDomains();
  const nav = document.getElementById('drillNav');
  let html = '<div class="drill-back" onclick="switchView(\'list\')">← 返回列表</div>';
  domains.forEach(d => {
    html += `<div class="drill-nav-domain">${d.label}</div>`;
    (d.children||[]).forEach(sub => {
      (sub.pages||[]).forEach(p => {
        html += `<div class="drill-nav-item${p.id===activeId?' active':''}"
          onclick="drillNavClick('${p.id}',this)">
          <span style="color:#0c63fa;font-size:9px">●</span>${p.title}
        </div>`;
      });
    });
  });
  nav.innerHTML = html;
}

function drillNavClick(id, el) {
  document.querySelectorAll('.drill-nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  _renderDrillPage(id);
}

function _renderDrillPage(id) {
  const found = _findPage(id);
  if (!found) return;
  const {page} = found;
  const isFav = S.favs.has(id);
  document.getElementById('drillContent').innerHTML = `
    <button class="drill-fav-btn ${isFav?'active':''}"
            onclick="toggleFavDrill('${id}')">${isFav?'★ 已收藏':'☆ 收藏'}</button>
    <div class="drill-title">${page.title}</div>
    <div class="drill-meta">
      <div class="drill-meta-item">来源文档 <b>${page.source||'—'}</b></div>
      <div class="drill-meta-item">最后更新 <b>${page.updatedAt||'—'}</b></div>
      ${page.tag?`<div class="drill-meta-item">标签 <b>${page.tag}</b></div>`:''}
    </div>
    ${page.tag?`<div class="drill-tag">${page.tag}</div>`:''}
    <div class="drill-body">${page.summary||'暂无内容摘要。'}</div>
    ${page.source?`<div class="drill-src-link"
        onclick="window.open(KB_BASE+'/'+\`${id}\`,'_blank')">
        ↗ 查看原文（${page.source}）</div>`:''}
  `;
}

function toggleFavDrill(id) {
  toggleFav(id);
  _renderDrillPage(id);
  // 同步列表视图收藏标记
  renderListView();
}

function renderRolePills() {
  document.getElementById('rolePills').innerHTML = DATA.roles.map(r =>
    `<div class="tool-role-pill ${S.role===r.key?'active':''}" onclick="selectRole('${r.key}')">${r.label}</div>`
  ).join('');
}

function selectRole(role) {
  S.role = role; S.zoom = 1; S.pan = {x:0,y:0};
  S.showFavs = false;
  document.getElementById('favPanel').classList.remove('show');
  document.getElementById('favBtn').classList.remove('active');
  renderRolePills(); resizeCanvas();
}

function resizeCanvas() {
  const rect = document.getElementById('graphAreaWrap').getBoundingClientRect();
  canvas.width = rect.width; canvas.height = rect.height;
  buildGraph(); drawGraph();
}

/* ── 力导向布局 + 绘制 ── */
let DPR = window.devicePixelRatio || 1;
let CW = 0, CH = 0;   // CSS 尺寸

function resizeCanvas() {
  const rect = document.getElementById('graphAreaWrap').getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  DPR = window.devicePixelRatio || 1;
  CW = rect.width; CH = rect.height;
  canvas.width  = Math.round(CW * DPR);
  canvas.height = Math.round(CH * DPR);
  canvas.style.width  = CW + 'px';
  canvas.style.height = CH + 'px';
  buildGraph(); drawGraph();
}

/*
 * 力导向：斥力 + 弹簧 + 向心力
 * 迭代完成后把坐标归一化到画布内，外层 pan/zoom 从 1 / (0,0) 开始
 */
function buildGraph() {
  const cx = CW / 2, cy = CH / 2;
  const domains = (DATA.graph[S.role] || { domains: [] }).domains;
  const nodes = [], links = [];

  const push = (n) => { nodes.push(n); return n; };

  const center = push({ id:'center', kind:'center', label:'HR域',
                        x:cx, y:cy, vx:0, vy:0, r:16 });

  domains.forEach((dom, di) => {
    const a = Math.PI * 2 * di / domains.length - Math.PI / 2;
    const dn = push({ id:dom.key, kind:'domain', label:dom.label,
                      x:cx + Math.cos(a)*70, y:cy + Math.sin(a)*70, vx:0, vy:0, r:11 });
    links.push({ s:center, t:dn });

    const subs = dom.children || [];
    subs.forEach((sub, si) => {
      const sa = a + (si - (subs.length - 1) / 2) * 0.42;
      const sn = push({ id:sub.key, kind:'sub', label:sub.label,
                        x:dn.x + Math.cos(sa)*52, y:dn.y + Math.sin(sa)*52, vx:0, vy:0, r:7 });
      links.push({ s:dn, t:sn });

      const pages = sub.pages || [];
      pages.forEach((page, pi) => {
        const pa = sa + (pi - (pages.length - 1) / 2) * 0.32;
        const pn = push({ id:page.id, kind:'page', label:page.title, page,
                          x:sn.x + Math.cos(pa)*40, y:sn.y + Math.sin(pa)*40, vx:0, vy:0, r:4.5 });
        links.push({ s:sn, t:pn });
      });
    });
  });

  /* ── 迭代 ── */
  const ITER = 420;
  for (let it = 0; it < ITER; it++) {
    const alpha = 1 - it / ITER;

    /* 斥力：所有节点两两推开 */
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 0.01) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = .25; }
        const d = Math.sqrt(d2);
        const want = a.r + b.r + 16;
        /* 只在过近时推开，避免整体被炸散 */
        if (d < want) {
          const f = (want - d) / d * 0.5 * alpha;
          const fx = dx * f, fy = dy * f;
          a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
        }
      }
    }

    /* 弹簧：连边保持合适距离 */
    links.forEach(l => {
      const a = l.s, b = l.t;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || .01;
      const target = a.r + b.r + (b.kind === 'page' ? 26 : 34);
      const f = (d - target) * 0.035 * alpha;
      const fx = dx / d * f, fy = dy / d * f;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    });

    /* 向心 + 阻尼 */
    nodes.forEach(n => {
      n.vx += (cx - n.x) * 0.008 * alpha;
      n.vy += (cy - n.y) * 0.008 * alpha;
      n.x += n.vx; n.y += n.vy;
      n.vx *= 0.5; n.vy *= 0.5;
    });
  }

  /* ── 归一化到画布，留出边距给标签 ── */
  const PAD = 26;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  nodes.forEach(n => {
    minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x);
    minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y);
  });
  const spanX = (maxX - minX) || 1, spanY = (maxY - minY) || 1;
  const availW = Math.max(CW - PAD * 2, 60), availH = Math.max(CH - PAD * 2, 60);
  const k = Math.min(availW / spanX, availH / spanY);
  const offX = PAD + (availW - spanX * k) / 2;
  const offY = PAD + (availH - spanY * k) / 2;
  nodes.forEach(n => {
    n.x = offX + (n.x - minX) * k;
    n.y = offY + (n.y - minY) * k;
    n.r = Math.max(n.r * Math.min(k, 1.15), n.kind === 'page' ? 3.5 : 5);
  });

  S.nodes = nodes; S.edges = links;
  S.zoom = 1; S.pan = { x: 0, y: 0 };
}

/* ── 配色：蓝为主，金为强调，红为告警 ── */
const COL = {
  center:  '#e9a33a',
  domain:  '#e9a33a',
  sub:     '#7aa7e0',
  page:    '#7aa7e0',
  pageFav: '#e9a33a',
  pageBad: '#e07070',
  label:   '#8a9099',
  labelHi: '#1f2329',
  edge:    'rgba(140,160,190,.42)',
};

function nodeColor(n) {
  if (n.kind === 'center' || n.kind === 'domain') return COL.center;
  if (n.kind === 'sub') return COL.sub;
  if (S.favs.has(n.id)) return COL.pageFav;
  if (n.page && n.page.hasConflict) return COL.pageBad;
  return COL.page;
}

function drawGraph() {
  if (!CW) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, CW, CH);
  ctx.translate(S.pan.x, S.pan.y);
  ctx.scale(S.zoom, S.zoom);

  const map = Object.fromEntries(S.nodes.map(n => [n.id, n]));

  /* 连线 */
  ctx.strokeStyle = COL.edge;
  ctx.lineWidth = 0.6;
  S.edges.forEach(e => {
    const a = e.s, b = e.t; if (!a || !b) return;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  });

  /* 节点 */
  S.nodes.forEach(n => {
    const hov = S.hovered === n.id;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r + (hov ? 2 : 0), 0, Math.PI * 2);
    ctx.fillStyle = nodeColor(n);
    ctx.fill();

    /* 收藏星标（canvas内绘制，hover或已收藏时显示） */
    if (n.kind === 'page') {
      const isFav = S.favs.has(n.id);
      if (hov || isFav) {
        const sr = Math.max(5, n.r * 0.85);
        const sx = n.x + n.r * 0.8 + sr;
        const sy = n.y - n.r * 0.8 - sr;
        n._favX = sx; n._favY = sy; n._favR = sr + 4;
        ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2);
        ctx.fillStyle = isFav ? '#e9a33a' : 'rgba(255,255,255,0.95)'; ctx.fill();
        ctx.strokeStyle = isFav ? '#e9a33a' : 'rgba(31,35,41,0.2)';
        ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = isFav ? '#fff' : '#c0c4cc';
        ctx.font = `${sr * 1.1}px ${FONT}`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('★', sx, sy + 0.5);
      } else { n._favX = null; }
    } else { n._favX = null; }

    /* 标签 */
    if (n.kind !== 'page' || n.r >= 4) {
      ctx.fillStyle = hov ? COL.labelHi : COL.label;
      ctx.font = (n.kind === 'center' ? '600 10px ' : n.kind === 'domain' ? '500 10px ' : '9px ') + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      const full = n.label || '';
      const max = n.kind === 'page' ? 8 : 10;
      const txt = full.length > max ? full.slice(0, max) + '…' : full;
      const ty = hov ? n.y - n.r - 13 : n.y + n.r + 3;
      /* 白底描边，让文字在密集区域也能读 */
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = 'rgba(255,255,255,.92)';
      ctx.strokeText(txt, n.x, ty);
      ctx.fillText(txt, n.x, ty);
    }

  });
  ctx.restore();
}

/* ── 星标命中检测 ── */
function hitFav(cx, cy) {
  const rect = canvas.getBoundingClientRect();
  const x = (cx - rect.left - S.pan.x) / S.zoom;
  const y = (cy - rect.top  - S.pan.y) / S.zoom;
  for (let i = S.nodes.length - 1; i >= 0; i--) {
    const n = S.nodes[i];
    if (!n._favX) continue;
    const dx = x - n._favX, dy = y - n._favY;
    if (dx*dx + dy*dy <= n._favR * n._favR) return n;
  }
  return null;
}

/* ── 命中检测 ── */


function hitTest(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const mx = (clientX - rect.left - S.pan.x) / S.zoom;
  const my = (clientY - rect.top  - S.pan.y) / S.zoom;

  for (let i = S.nodes.length - 1; i >= 0; i--) {
    const n = S.nodes[i], dx = mx - n.x, dy = my - n.y;
    if (dx*dx + dy*dy <= (n.r+6)*(n.r+6)) return { node: n };
  }
  return null;
}

canvas.addEventListener('mousedown', e => {
  S.dragMoved = false;
  S.dragging = true;
  canvas.style.cursor = 'grabbing';
});
window.addEventListener('mouseup', () => { S.dragging = false; });

canvas.addEventListener('mousemove', e => {
  if (S.dragging) {
    if (Math.abs(e.movementX) > 1 || Math.abs(e.movementY) > 1) S.dragMoved = true;
    S.pan.x += e.movementX; S.pan.y += e.movementY; drawGraph(); return;
  }
  const favN = hitFav(e.clientX, e.clientY);
  const hit  = favN ? null : hitTest(e.clientX, e.clientY);
  const ph   = S.hovered;
  S.hovered  = favN ? favN.id : (hit ? hit.node.id : null);
  canvas.style.cursor = (favN || hit) ? 'pointer' : 'grab';
  if (S.hovered !== ph) drawGraph();
});

canvas.addEventListener('mouseleave', () => {
  S.hovered = null; canvas.style.cursor = 'grab'; drawGraph();
});

canvas.addEventListener('click', e => {
  if (S.dragMoved) return;
  const favN = hitFav(e.clientX, e.clientY);
  if (favN) { toggleFav(favN.id); return; }
  const hit = hitTest(e.clientX, e.clientY);
  if (!hit) return;
  if (hit.node.kind === 'page') window.open(KB_BASE + '/' + hit.node.id, '_blank');
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const before = { x: (mx - S.pan.x) / S.zoom, y: (my - S.pan.y) / S.zoom };
  S.zoom = Math.min(3, Math.max(.4, S.zoom * (e.deltaY < 0 ? 1.1 : .9)));
  S.pan.x = mx - before.x * S.zoom;
  S.pan.y = my - before.y * S.zoom;
  drawGraph();
}, { passive: false });

/* 收藏 */
function toggleFav(id) {
  S.favs.has(id) ? S.favs.delete(id) : S.favs.add(id);
  localStorage.setItem('hr-kc-favs', JSON.stringify([...S.favs]));
  drawGraph();
  renderFavPanel();
}

function toggleFavView() {
  S.showFavs = !S.showFavs;
  const panel = document.getElementById('favPanel');
  const btn   = document.getElementById('favBtn');
  panel.classList.toggle('show', S.showFavs);
  btn.classList.toggle('active', S.showFavs);
  if (S.showFavs) renderFavPanel();
}

function allPagesAllRoles() {
  const out = [];
  Object.keys(DATA.graph).forEach(role => {
    (DATA.graph[role]||{domains:[]}).domains.forEach(d =>
      d.children.forEach(s => s.pages.forEach(p =>
        out.push({...p, domain:d.label, sub:s.label, role}))));
  });
  // 去重（同一页可能在多角色下出现相同 id）
  const seen = new Set();
  return out.filter(p => { if (seen.has(p.id)) return false; seen.add(p.id); return true; });
}

function renderFavPanel() {
  const panel = document.getElementById('favPanel');
  const pages = allPagesAllRoles().filter(p=>S.favs.has(p.id));
  if (!pages.length) {
    panel.innerHTML = '<div class="fav-empty"><span style="font-size:22px">☆</span><span>还没有收藏</span><span style="font-size:11px">点击节点旁的 ★ 可收藏常用知识</span></div>';
    return;
  }
  panel.innerHTML = '<div style="font-size:13px;font-weight:600;padding:0 2px 4px">我的收藏 · '+pages.length+'</div>' +
    pages.map(p=>`
      <div class="fav-item" onclick="window.open('${KB_BASE}/${p.id}','_blank')">
        <div class="fav-item-info">
          <div class="fav-item-title">${p.title}</div>
          <div class="fav-item-meta">${p.domain} · ${p.sub} · ${p.updatedAt}</div>
        </div>
        <button class="fav-unfav" title="取消收藏" onclick="event.stopPropagation();toggleFav('${p.id}')">★</button>
      </div>`).join('');
}

/* 搜索 */
function allPages() {
  const out=[];
  (DATA.graph[S.role]||{domains:[]}).domains.forEach(d=>
    d.children.forEach(s=>s.pages.forEach(p=>out.push({...p,domain:d.label,sub:s.label}))));
  return out;
}

document.getElementById('searchInput').addEventListener('input', e=>{
  const q=e.target.value.trim().toLowerCase();
  const box=document.getElementById('searchFloating');
  if (!q) { box.classList.remove('show'); return; }
  const hits=allPages().filter(p=>
    p.title.toLowerCase().includes(q)||p.summary.toLowerCase().includes(q)||p.tag.toLowerCase().includes(q));
  box.classList.add('show');
  box.innerHTML = hits.length
    ? hits.map(p=>`
        <div class="search-item" onclick="window.open('${KB_BASE}/${p.id}','_blank')">
          <div class="search-item__title">${p.title}
            <span class="tiny-tag tiny-tag--neutral">${p.tag}</span>
            ${p.hasConflict?'<span class="tiny-tag tiny-tag--warn">有冲突</span>':''}
            ${p.isNew?'<span class="tiny-tag tiny-tag--success">已更新</span>':''}
          </div>
          <div class="search-item__meta">${p.domain} · ${p.sub} · ${p.updatedAt}</div>
        </div>`).join('')
    : '<div style="padding:40px 0;text-align:center;color:var(--color-text-tertiary)">没有找到相关知识</div>';
});

/* ════════════════════════════════
   生产卡片
════════════════════════════════ */
function pendingCount() {
  return DATA.pendingItems.filter(i=>!S.resolved[i.id]).length;
}

function updateBadge() {
  const el=document.getElementById('pendingBadge');
  if (el) el.textContent=pendingCount();
}

function switchTab(tab, el) {
  document.querySelectorAll('.toft-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
}

/* 待处理 */
function renderTodoPanel() {
  const el=document.getElementById('panel-todo');
  const groups=['conflict','proposal','quality'];
  const html=groups.map(kind=>{
    const items=DATA.pendingItems.filter(i=>i.kind===kind);
    if (!items.length) return '';
    const meta=KIND_META[kind];
    return `<div class="group-label"><span class="dot" style="background:${meta.color}"></span>${meta.label} · ${items.length}</div>`+
           items.map(i=>renderTodoCard(i)).join('');
  }).join('');
  el.innerHTML = html || '<div style="padding:48px 0;text-align:center;color:var(--color-text-tertiary)">待处理已清空 ✅</div>';
}

function renderTodoCard(item) {
  const done=S.resolved[item.id];
  const meta=KIND_META[item.kind];
  const tagStyle=`background:${meta.color}1a;color:${meta.color}`;

  if (done) {
    const txt={new:'已用新版',old:'已保留旧版',pass:'已通过上线',redo:'已退回重新加工'}[done];
    return `<div class="todo-card done">
      <div class="todo-head">
        <span class="tiny-tag" style="${tagStyle}">${meta.label}</span>
        <div class="todo-title">${item.pageTitle}</div>
      </div>
      <div class="resolve-note">✓ ${txt}<button class="link-btn" style="margin-left:auto" onclick="undoResolve('${item.id}')">撤销</button></div>
    </div>`;
  }

  let body='';
  if (item.kind==='conflict') {
    body=`<div class="conflict-hint">⚡ ${item.hint}</div>
      <div class="claim"><span class="claim-key new">新的</span><span class="claim-txt">${item.newText}</span></div>
      <div class="claim"><span class="claim-key old">旧的</span><span class="claim-txt">${item.oldText}</span></div>`;
  } else if (item.kind==='proposal') {
    body=item.diff.map(d=>`<div class="diff-line ${d.type}"><span class="diff-sign">${d.type==='add'?'+':d.type==='remove'?'−':''}</span><span class="diff-txt">${d.text}</span></div>`).join('');
  } else {
    body=`<div style="color:var(--color-text-secondary)">${item.reason}</div>
      <div style="font-size:11px;color:var(--color-text-tertiary);margin-top:3px">AI 信心 ${Math.round(item.confidence*100)}% · ${item.pagesCount} 个页面</div>`;
  }

  const btns=item.kind==='quality'
    ? `<button class="toft-button toft-button--ghost" onclick="resolve('${item.id}','redo')">重新加工</button>
       <button class="toft-button toft-button--primary" onclick="resolve('${item.id}','pass')">通过</button>`
    : `<button class="toft-button toft-button--ghost" onclick="resolve('${item.id}','old')">${item.kind==='conflict'?'保留旧版':'暂不更新'}</button>
       <button class="toft-button toft-button--primary" onclick="resolve('${item.id}','new')">用新版</button>`;

  return `<div class="todo-card">
    <div class="todo-head">
      <span class="tiny-tag" style="${tagStyle}">${meta.label}</span>
      <div class="todo-title">${item.pageTitle}</div>
      <span class="todo-time">${item.uploadedAt}</span>
    </div>
    <div class="todo-body">${body}</div>
    <div class="todo-footer" style="justify-content:flex-end">${btns}</div>
  </div>`;
}

function resolve(id, choice) { S.resolved[id]=choice; updateBadge(); renderTodoPanel(); }
function undoResolve(id)     { delete S.resolved[id]; updateBadge(); renderTodoPanel(); }

/* 进度跟踪 */
function renderProgressPanel() {
  const STEPS    = ['已提交','生成知识','冲突检查','完成'];
  const STEP_IDX = { submitted:0, generating:1, checking:2, done:3 };
  document.getElementById('panel-progress').innerHTML = DATA.tasks.map(t=>{
    const failed = t.status==='failed';
    const done   = t.status==='done';
    const cur    = failed ? (STEP_IDX[t.failedAt]??1) : (STEP_IDX[t.status]??0);

    let statusBadge='';
    if (failed)               statusBadge='<span class="role-badge fail">处理失败</span>';
    else if (done&&t.conflictCount) statusBadge='<span class="role-badge warn">'+t.conflictCount+' 项待裁决</span>';
    else if (done)            statusBadge='<span class="role-badge done">'+t.pageCount+' 页已生效</span>';
    else if (t.status==='checking') statusBadge='<span class="role-badge active">冲突检查中</span>';
    else                      statusBadge='<span class="role-badge active">处理中</span>';

    const track=STEPS.map((label,i)=>{
      const isDone = done ? i<=cur : (!failed&&i<cur);
      const isAct  = !failed&&!done&&i===cur;
      const isFail = failed&&i===cur;
      const isConf = i===2&&done&&t.conflictCount>0;
      let dc = isDone?(isConf?'conflict':'done'):isAct?'active':isFail?'fail':'';
      let lc = (isDone||isAct)?'hi':isFail?'fail-lbl':isConf?'conf-lbl':'';
      return '<div class="prog-step '+(i===0?'is-submitted':'')+'"><div class="prog-dot '+dc+'"></div>'+
             '<div class="prog-step-label '+lc+'">'+label+'</div></div>'+
             (i<STEPS.length-1?'<div class="prog-line'+(isDone&&!isConf?' done':'')+'"></div>':'');
    }).join('');

    const note = (done&&t.conflictCount)
      ? '<div class="conflict-note">发现 '+t.conflictCount+' 处内容冲突，已进入「待处理」等待裁决</div>' : '';
    const failBlock = failed&&t.failReason
      ? '<div class="fail-reason">⚠ '+t.failReason+'</div>' : '';

    return '<div class="progress-card">'+
      '<div class="progress-head">'+
        '<div class="progress-title" style="cursor:pointer;color:var(--color-brand-primary)" onclick="window.open(\'https://knowledge-cloud.staging.kuaishou.com/?app=hr#/ssc-service-delivery/tasks\',\'_blank\')">'+t.sourceTitle+(failed?' <span class="tiny-tag" style="background:#fff5f5;color:#b50707">失败</span>':'')+'</div>'+
        statusBadge+
      '</div>'+
      '<div class="prog-track">'+track+'</div>'+
      note+failBlock+
    '</div>';
  }).join('');
}

/* 知识管理 */
